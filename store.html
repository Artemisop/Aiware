<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aiware - Store</title>
<style>
    body { background-color: #0b0b0e; color: #9f9fa8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    header { background-color: #121217; padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #23232c; }
    .header-left { display: flex; align-items: center; gap: 30px; }
    .logo { font-size: 22px; color: #dc5b5b; font-weight: bold; letter-spacing: 1px; text-decoration: none;} 
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: #9f9fa8; text-decoration: none; font-size: 14px; }
    .nav-links a.active, .nav-links a:hover { color: #ffffff; }
    .user-nav { display: flex; gap: 15px; font-size: 14px; align-items: center; color: #d0d0d6; }
    .container { padding: 40px 50px; max-width: 1200px; margin: 0 auto; }
    .page-title { color: #d0d0d6; font-size: 24px; margin-bottom: 10px; font-weight: 500; }
    .sub-status { font-size: 14px; color: #6e8bc3; margin-bottom: 30px; }
    .store-grid { display: flex; gap: 20px; flex-wrap: wrap; }
    .product-card { background-color: #121217; border: 1px solid #23232c; border-radius: 6px; padding: 30px 20px; flex: 1; min-width: 220px; text-align: center; transition: transform 0.2s, border-color 0.2s; }
    .product-card:hover { border-color: #6e8bc3; transform: translateY(-5px); }
    .product-icon { font-size: 40px; margin-bottom: 15px; opacity: 0.8; }
    .product-title { color: #ffffff; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
    .product-desc { font-size: 13px; color: #767682; margin-bottom: 25px; min-height: 40px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn { padding: 10px 15px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: background 0.2s; }
    .btn-buy { background-color: #6e8bc3; color: #ffffff; }
    .btn-buy:hover { background-color: #5a75a8; }
    .btn-gift { background-color: #23232c; color: #d0d0d6; }
    .btn-gift:hover { background-color: #2c2c36; }
    .badge-admin { background: #dc5b5b; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 5px; }
</style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="index.html" class="logo">aiware</a>
        <div class="nav-links">
            <a href="index.html">Members</a>
            <a href="store.html" class="active">Store</a>
        </div>
    </div>
    <div class="user-nav">
        <span id="userDisplay">👤 Загрузка...</span>
    </div>
</header>

<div class="container">
    <div class="page-title">Store - Выбор подписки</div>
    <div class="sub-status" id="subStatus">Статус подписки: проверка...</div>
    
    <div class="store-grid">
        <div class="product-card">
            <div class="product-icon">🥉</div>
            <div class="product-title">7 Дней</div>
            <div class="product-desc">Доступ ко всем функциям aiware на одну неделю.</div>
            <div class="btn-group">
                <button class="btn btn-buy" onclick="buySub(7)">Купить</button>
                <button class="btn btn-gift" onclick="alert('Недоступно')">Подарить</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-icon">🥈</div>
            <div class="product-title">14 Дней</div>
            <div class="product-desc">Оптимальный выбор для тестирования софта.</div>
            <div class="btn-group">
                <button class="btn btn-buy" onclick="buySub(14)">Купить</button>
                <button class="btn btn-gift" onclick="alert('Недоступно')">Подарить</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-icon">🥇</div>
            <div class="product-title">30 Дней</div>
            <div class="product-desc">Стандартная подписка на целый месяц.</div>
            <div class="btn-group">
                <button class="btn btn-buy" onclick="buySub(30)">Купить</button>
                <button class="btn btn-gift" onclick="alert('Недоступно')">Подарить</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-icon">💎</div>
            <div class="product-title">90 Дней</div>
            <div class="product-desc">Максимальная выгода. Доступ на 3 месяца.</div>
            <div class="btn-group">
                <button class="btn btn-buy" onclick="buySub(90)">Купить</button>
                <button class="btn btn-gift" onclick="alert('Недоступно')">Подарить</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = localStorage.getItem('aiware_user') || "Artemisop";
    let subDays = parseInt(localStorage.getItem('aiware_sub') || "0");

    let userHtml = `👤 ${currentUser}`;
    if (currentUser === "Artemisop") {
        userHtml += ` <span class="badge-admin">ADMIN</span>`;
    }
    document.getElementById('userDisplay').innerHTML = userHtml;

    updateSubText();

    function updateSubText() {
        if (subDays > 0) {
            document.getElementById('subStatus').innerHTML = `Статус подписки: <span style="color: #4CAF50; font-weight: bold;">Активна (${subDays === 999 ? 'Вечный доступ (Админ)' : subDays + ' дней'})</span>`;
        } else {
            document.getElementById('subStatus').innerHTML = `Статус подписки: <span style="color: #dc5b5b; font-weight: bold;">Не активна</span>`;
        }
    }

    function buySub(days) {
        // Если вы зашли под своим аккаунтом Artemisop, начисляем бесплатно
        if (currentUser === "Artemisop") {
            subDays = days === 90 ? 90 : days; // Начислит выбранное количество (например, 90 дней при клике на 90)
            localStorage.setItem('aiware_sub', subDays);
            updateSubText();
            alert(`Успешно! Вам автоматически начислено ${days} дней подписки (бесплатно для администратора).`);
        } else {
            // Для остальных пользователей выдает ошибку
            alert('Недоступно');
        }
    }
</script>
</body>
</html>
